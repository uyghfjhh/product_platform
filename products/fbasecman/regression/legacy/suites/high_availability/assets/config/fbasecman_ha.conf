# Configuration template for high_availability suite
pid_file "__PID_FILE__"
daemonize yes
unix_socket_dir "/tmp"
unix_socket_mode "0644"

log_format "%p %t %l [%i %s] (%c) %m\n"
log_to_stdout no
log_syslog no
log_debug yes
log_config yes
log_session yes
log_query yes
log_stats yes
log_file "__LOG_FILE__"
log_min_messages "info"
license_dir "__LICENSE_DIR__"
enable_guc_sync yes

stats_interval 60
promhttp_server_port __PROM_PORT__
log_general_stats_prom no
log_route_stats_prom no
workers "auto"
resolvers 1
readahead 8192
cache_coroutine 0
coroutine_stack_size 16
nodelay yes
locks_dir "__LOCKS_DIR__"
config_backup_dir "__BACKUP_DIR__"
graceful_die_on_errors yes
enable_online_restart no
bindwith_reuseport yes
keepalive 15
keepalive_keep_interval 75
keepalive_probes 9
heartbeat_request "select 10086"
keepalive_usr_timeout 0

monitor_enabled yes
monitor_period 2
monitor_retry_period_ms 1000
monitor_max_retries 3
monitor_recovery_max_retries 3

host "*"
ports "__PORT__"
backlog 128
compression yes

# 4 Types of Groups defined in Chapter 4 / Section 2.2
group "qa_rep" {
    group_mode "replication"
    storage_db "postgres"
    backend_clusters "site_a"
    check "auto"
}

group "qa_mmr" {
    group_mode "mmr"
    storage_db "postgres"
    backend_clusters "site_a,site_b"
    write_cluster "site_a"
    promoted_cluster "site_b"
    check "auto"
}

group "qa_bal_rw" {
    group_mode "balance"
    storage_db "postgres"
    backend_clusters "site_a,site_b"
    access_mode "read_write"
}

group "qa_bal_ro" {
    group_mode "balance"
    storage_db "postgres"
    backend_clusters "site_a,site_b"
    access_mode "read_only"
}

group "qa_single_rw" {
    group_mode "single"
    storage_db "postgres"
    backend_clusters "site_a"
    access_mode "read_write"
}

group "qa_single_ro" {
    group_mode "single"
    storage_db "postgres"
    backend_clusters "site_a"
    access_mode "read_only"
}

# Backend Datasources (A0, A1, B0, B1)
datasources "test_mmr1" {
    host "__DB_HOST__"
    port __PORT_A0__
    cluster_name "site_a"
    weight 10
    tls "disable"
}

datasources "test_mmr1_s1" {
    host "__DB_HOST__"
    port __PORT_A1__
    cluster_name "site_a"
    application_name "pg_240"
    weight 10
    tls "disable"
}

datasources "test_mmr2" {
    host "__DB_HOST__"
    port __PORT_B0__
    cluster_name "site_b"
    weight 10
    tls "disable"
}

datasources "test_mmr2_s1" {
    host "__DB_HOST__"
    port __PORT_B1__
    cluster_name "site_b"
    application_name "pg_250"
    weight 10
    tls "disable"
}

# Application Users
user "admin" {
    authentication "none"
    role "admin"
    pool "session"
}

user "qa_admin" {
    authentication "none"
    role "admin"
    pool "session"
}

user "postgres" {
    group_names "qa_rep,qa_mmr,qa_bal_rw,qa_bal_ro,qa_single_rw,qa_single_ro"
    storage_user "postgres"
    storage_password ""
    rw_split_method "none"
    pool "transaction"
    pool_size 10
    pool_timeout 1000
    pool_discard no
    client_max 100
    authentication "none"
}

user "qa_app_user" {
    group_names "qa_rep,qa_mmr,qa_bal_rw,qa_bal_ro,qa_single_rw,qa_single_ro"
    storage_user "postgres"
    storage_password ""
    rw_split_method "none"
    pool "transaction"
    pool_size 10
    pool_timeout 1000
    pool_discard no
    client_max 100
    authentication "none"
}
