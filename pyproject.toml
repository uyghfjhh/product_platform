[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "company-product-platform"
version = "0.1.0"
description = "Internal product management and validation platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "huey>=2.5,<3",
    "psycopg[binary]>=3.2,<4",
    "cryptography>=44,<49",
    "argon2-cffi>=23,<26",
    "PyNaCl>=1.5,<2",
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
product-platform = "platform_app.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
