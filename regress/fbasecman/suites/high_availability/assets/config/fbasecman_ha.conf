pid_file "__PID_FILE__"
daemonize yes
priority 0
log_to_stdout no
log_syslog no
log_format "%p %t %l [%i %s] (%c) %m\n"
log_syslog_ident "fbasecman"
log_syslog_facility "daemon"
log_debug yes
log_config yes
log_session yes
log_query no
log_stats yes
stats_interval 60
log_file "__LOG_FILE__"
log_min_messages "info"
unix_socket_dir "/tmp"
unix_socket_mode "0644"
locks_dir "__LOCKS_DIR__"
config_backup_dir "__BACKUP_DIR__"
license_dir "/home/postgres/lic"
enable_guc_sync yes
bindwith_reuseport yes
keepalive 15
keepalive_keep_interval 75
keepalive_probes 9
keepalive_usr_timeout 0
host "*"
ports "__PORT__"
promhttp_server_port __PROM_PORT__
backlog 128
compression yes
tls "disable"
heartbeat_request "select 1"
admin_database "console"
server_login_retry 5
cache_msg_gc_size 0
cache_coroutine 108
coroutine_stack_size 16
workers 8
resolvers 1
readahead 8192
nodelay yes
graceful_die_on_errors yes
enable_online_restart no
monitor_period 2
monitor_retry_period_ms 1000
monitor_max_retries 3
monitor_recovery_max_retries 3
monitor_timeout 1000

group "qa_rep" {
    group_mode "replication"
    storage_db "postgres"
    backend_clusters "site_a"
    check "auto"
}

group "qa_mmr" {
    group_mode "mmr"
    storage_db "postgres"
    backend_clusters "site_a,site_b"
    write_cluster "site_a"
    promoted_cluster "site_b"
    real_group_name "__MMR_REAL_GROUP__"
    group_uuid "__MMR_GROUP_UUID__"
    check "auto"
}

group "qa_bal_rw" {
    group_mode "balance"
    storage_db "postgres"
    access_mode "read_write"
    backend_clusters "site_a,site_b"
    check "auto"
}

group "qa_bal_ro" {
    group_mode "balance"
    storage_db "postgres"
    access_mode "read_only"
    backend_clusters "site_a,site_b"
    check "auto"
}

group "qa_single_rw" {
    group_mode "single"
    storage_db "postgres"
    access_mode "read_write"
    backend_clusters "site_a"
    check "auto"
}

group "qa_single_ro" {
    group_mode "single"
    storage_db "postgres"
    access_mode "read_only"
    backend_clusters "site_a"
    check "auto"
}

datasources "test_mmr1" {
    host "__DB_HOST__"
    port __PORT_A0__
    cluster_name "site_a"
    weight 10
    status "active"
    system_identifier "__SYSID_A0__"
    tls "disable"
}

datasources "test_mmr1_s1" {
    host "__DB_HOST__"
    port __PORT_A1__
    cluster_name "site_a"
    weight 10
    status "active"
    application_name "pg_240"
    system_identifier "__SYSID_A1__"
    tls "disable"
}

datasources "test_mmr2" {
    host "__DB_HOST__"
    port __PORT_B0__
    cluster_name "site_b"
    weight 10
    status "active"
    system_identifier "__SYSID_B0__"
    tls "disable"
}

datasources "test_mmr2_s1" {
    host "__DB_HOST__"
    port __PORT_B1__
    cluster_name "site_b"
    weight 10
    status "active"
    application_name "pg_250"
    system_identifier "__SYSID_B1__"
    tls "disable"
}

user "qa_admin" {
    role "admin"
    authentication "none"
    pool "session"
}

user "admin" {
    role "admin"
    authentication "none"
    pool "session"
}

user "qa_app_user" {
    authentication "none"
    storage_user "postgres"
    group_names "qa_rep,qa_mmr,qa_bal_rw,qa_bal_ro,qa_single_rw,qa_single_ro"
    pool "transaction"
    pool_size 20
    pool_discard no
    rw_split_method "none"
}

user "postgres" {
    authentication "none"
    storage_user "postgres"
    group_names "qa_rep,qa_mmr,qa_bal_rw,qa_bal_ro,qa_single_rw,qa_single_ro"
    pool "transaction"
    pool_size 20
    pool_discard no
    rw_split_method "none"
}
